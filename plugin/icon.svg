<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Inspethct VS Code Icon</title>
  <desc id="desc">Ethereum logo with magnifier glass.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1b2a46"/>
    </linearGradient>
    <linearGradient id="ethTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fb6ff"/>
      <stop offset="100%" stop-color="#6c89ff"/>
    </linearGradient>
    <linearGradient id="ethBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4b67d6"/>
      <stop offset="100%" stop-color="#2e47a6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8be9ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d8f5ff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="92" fill="#ffffff" fill-opacity="0.03"/>

  <g filter="url(#shadow)">
    <polygon points="128,46 80,126 128,150 176,126" fill="url(#ethTop)"/>
    <polygon points="128,160 80,136 128,210 176,136" fill="url(#ethBottom)"/>
    <polygon points="128,56 92,122 128,144 164,122" fill="#d9e3ff" fill-opacity="0.2"/>
  </g>

  <g transform="translate(0 0)">
    <circle cx="172" cy="170" r="34" fill="url(#glass)" stroke="#9fe8ff" stroke-width="10"/>
    <line x1="196" y1="194" x2="224" y2="222" stroke="#9fe8ff" stroke-width="12" stroke-linecap="round"/>
    <line x1="160" y1="156" x2="182" y2="156" stroke="#ffffff" stroke-opacity="0.65" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
